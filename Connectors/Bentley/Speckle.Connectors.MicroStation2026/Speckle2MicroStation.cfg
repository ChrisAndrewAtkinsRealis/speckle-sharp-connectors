# Speckle connector configuration for MicroStation 2026.
# Copy this file to your MicroStation Organization configuration directory, e.g.:
#   %ProgramData%\Bentley\MicroStation 2026\Configuration\Organization\
# and point MS_ADDINPATH at the connector output folder.
MS_ADDINPATH > $(_USTN_USER)Addins/Speckle.Connectors.MicroStation2026/
MS_DGNAPPS > Speckle.Connectors.MicroStation2026
